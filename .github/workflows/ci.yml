name: Farmsy CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Backend Tests
      run: npm run test --workspace=apps/backend

    # Frontend tests can be added here once configured

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Backend Docker Image
      uses: docker/build-push-action@v3
      with:
        context: .
        file: apps/backend/Dockerfile
        push: false # Set to true when registry is configured
        tags: farmsy/backend:latest

    - name: Build Frontend Docker Image
      uses: docker/build-push-action@v3
      with:
        context: .
        file: apps/frontend/Dockerfile
        push: false
        tags: farmsy/frontend:latest
