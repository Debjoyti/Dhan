# .github/workflows/deploy.yml

# Triggers: push to main
# Steps per app:
# 1. Install dependencies (npm ci with cache)
# 2. Type check (tsc --noEmit)
# 3. Lint (eslint)
# 4. Test (jest --ci)
# 5. Prisma: generate + validate schema
# 6. Build Docker image
# 7. Push to ECR
# 8. Deploy to ECS (blue/green)
# 9. Run DB migrations (prisma migrate deploy)
# 10. Smoke test (curl key endpoints)
# 11. Notify Slack on success/failure

# Environment strategy:
# main branch → staging (auto-deploy)
# release/* → production (requires approval)
