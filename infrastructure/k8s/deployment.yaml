apiVersion: apps/v1
kind: Deployment
metadata:
  name: farmsy-backend
  labels:
    app: farmsy-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: farmsy-backend
  template:
    metadata:
      labels:
        app: farmsy-backend
    spec:
      containers:
      - name: farmsy-backend
        image: farmsy/backend:latest
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: farmsy-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: farmsy-secrets
              key: redis-url
---
apiVersion: v1
kind: Service
metadata:
  name: farmsy-backend-service
spec:
  selector:
    app: farmsy-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer
