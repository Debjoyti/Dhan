version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-farmsy_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farmsy_password}
      POSTGRES_DB: ${POSTGRES_DB:-farmsy_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - farmsy_network

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - farmsy_network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-farmsy_user}:${POSTGRES_PASSWORD:-farmsy_password}@postgres:5432/${POSTGRES_DB:-farmsy_db}
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - farmsy_network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "3001:3000"
    networks:
      - farmsy_network

volumes:
  postgres_data:
  redis_data:

networks:
  farmsy_network:
